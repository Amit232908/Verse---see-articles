{% extends 'main.html' %}

{% block content %}
 <div class="contact-page">

        <div class="contact-form-container">

            <form class="contact-form">

                <div class="name-row">

                    <div class="form-group">
                        <label for="first-name">First name*</label>
                        <input type="text" id="first-name" placeholder="eg. Amit" required >
                    </div>

                    <div class="form-group">
                        <label for="last-name">Last name*</label>
                        <input type="text" id="last-name" placeholder="eg. Das" required >
                    </div>

                </div>

                <div class="form-group">
                    <label for="email">Email Id*</label>
                    <input type="email" id="email" placeholder="eg. damit4781@gmail.com" required >
                </div>

                <div class="form-group">
                    <label for="phone">Phone number*</label>

                    <div class="phone-input">
                        <input type="tel" id="phone" placeholder="Enter phone number" required >
                    </div>
                </div>

                <div class="form-group">
                    <label for="message">Message*</label>

                    <textarea id="message" placeholder="Enter a question, feedback, or suggestions..." required ></textarea>
                </div>

                <button type="submit" class="submit-button">
                    Submit
                </button>

            </form>

        </div>

    </div>
{% endblock %}
